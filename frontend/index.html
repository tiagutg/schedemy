<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedemy | Painel de Agendamentos</title>
    <!-- Aplica o tema escolhido antes do primeiro desenho (ver src/hooks/useTema.ts) -->
    <script>
      try {
        var tema = localStorage.getItem("schedemy.tema");
        if (tema === "escuro" || (tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
