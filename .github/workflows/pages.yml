# Publica o front-end no GitHub Pages (https://tiagutg.github.io/schedemy/)
# a cada push na main que mexa nele. Também pode ser rodado à mão em Actions.
#
# Configuração no repositório (uma vez só):
# - Settings > Pages > Source: GitHub Actions
# - Settings > Secrets and variables > Actions > Variables: VITE_API_BASE_URL
#   com o endereço público da API (sem ele, o site abre mas não consegue entrar).
# - Na API, CORS_ALLOWED_ORIGINS precisa incluir https://tiagutg.github.io
name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova substitui a que estiver na fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        run: npm run build
        env:
          # O site fica em /schedemy/ (nome do repositório), não na raiz do domínio.
          BASE_PATH: /schedemy/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # O Pages não conhece as rotas do app: abrir /schedemy/agendamentos direto (ou dar F5)
      # cai na página 404. Ela recebe o próprio app, que então abre a rota certa.
      - name: Rotas do app ao atualizar a página
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
