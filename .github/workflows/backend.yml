# Verifica o back-end a cada push e pull request que mexa nele ou no banco.
#
# - mysql:      todos os testes (./mvnw test), incluindo os da tag "banco" contra um MySQL 8 com o
#               db/db_schedemy.sql: subida da aplicação (entidades x schema, queries JPQL) e
#               RepositoriosNoBancoTest (queries e travas FOR UPDATE).
# - postgresql: só os testes da tag "banco", com o perfil "supabase" apontando para um PostgreSQL 16
#               com o db/supabase_schema.sql. Pega diferenças entre os dois bancos.
#
# Os dois bancos são criados vazios a cada execução, só para o CI. Nada aqui acessa o Supabase.
name: Back-end

on:
  push:
    paths:
      - "backend/**"
      - "db/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "db/**"
      - ".github/workflows/backend.yml"

env:
  TZ: America/Sao_Paulo

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Criar o banco (db_schedemy.sql)
        run: mysql -h 127.0.0.1 -uroot -proot < ../db/db_schedemy.sql

      - name: Testes (todos, incluindo os da tag banco)
        run: ./mvnw -B test -DexcludedGroups=nenhum

  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schedemy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: supabase
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: schedemy
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Criar o banco (supabase_schema.sql)
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d schedemy -v ON_ERROR_STOP=1 -q -f ../db/supabase_schema.sql

      - name: Testes da tag banco
        run: ./mvnw -B test -Dgroups=banco -DexcludedGroups=nenhum
