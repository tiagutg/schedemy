# --- Perfil "supabase": banco PostgreSQL hospedado no Supabase ---
# Ative com a variável SPRING_PROFILES_ACTIVE=supabase. Sem o perfil, a API usa o MySQL.
#
# Variáveis de ambiente (veja "Connect" > "Session pooler" no painel do Supabase):
#   DB_HOST      ex.: aws-0-sa-east-1.pooler.supabase.com
#   DB_PORT      5432 (session pooler)
#   DB_NAME      postgres
#   DB_USER      ex.: postgres.<id-do-projeto>
#   DB_PASSWORD  senha do banco definida ao criar o projeto
#   DB_SSLMODE   opcional, padrao require

# DB_SSLMODE: o Supabase exige SSL; o CI usa um PostgreSQL local sem SSL (disable).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# O plano gratuito do Supabase limita as conexões do pooler (15 no modo sessão).
# 10 deixa as telas, que fazem várias chamadas ao mesmo tempo, sem fila, e sobra margem.
spring.datasource.hikari.maximum-pool-size=10

# Sobrescreve o dialeto MySQL do perfil padrão.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# O banco remoto custa ~0,2 s por consulta: busca os dados relacionados (participantes,
# organizador, duração...) de vários registros numa consulta só, em vez de um por um.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
