# --- Aplicação e Servidor ---
spring.application.name=schedemy
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never

# --- Docker Compose ---
spring.docker.compose.enabled=false

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- Banco de Dados MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:schedemy_db}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
# Sessao do Hibernate so dentro das transacoes dos services (os mappers rodam la dentro);
# acesso LAZY fora delas falha cedo em vez de gerar consultas escondidas na serializacao.
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Token de acesso (JWT, HS256) ---
# SCHEDEMY_JWT_SEGREDO: pelo menos 32 caracteres. Sem ele, a API sorteia um segredo a cada
# inicializacao (bom para desenvolvimento; ao reiniciar, todos precisam entrar de novo).
# Em producao defina sempre, e o mesmo em todas as instancias da API.
schedemy.jwt.segredo=${SCHEDEMY_JWT_SEGREDO:}
schedemy.jwt.validade-minutos=${SCHEDEMY_JWT_VALIDADE_MINUTOS:480}

# --- E-mail (RF 23) ---
# Os avisos de agendamento entram na tabela notificacao com canal EMAIL (status PENDENTE) e o
# EnvioDeEmails os envia por SMTP a cada minuto. Desligado por padrao: sem SCHEDEMY_EMAIL_ATIVO=true,
# nada sai e os e-mails ficam na fila. Os padroes de SMTP apontam para o Mailpit local
# (porta 1025, caixa de entrada em http://localhost:8025), que recebe tudo sem entregar a ninguem.
# Servidor real (faculdade, Microsoft 365, Gmail...): SMTP_HOST, SMTP_PORT, SMTP_USUARIO, SMTP_SENHA,
# SMTP_AUTH=true e SMTP_STARTTLS=true (porta 587).
schedemy.email.ativo=${SCHEDEMY_EMAIL_ATIVO:false}
schedemy.email.remetente=${SCHEDEMY_EMAIL_REMETENTE:Schedemy <nao-responda@unisales.edu.br>}
# Endereco do front usado nos links dos e-mails.
schedemy.email.url-front=${SCHEDEMY_URL_FRONT:http://localhost:5173}
schedemy.email.intervalo=${SCHEDEMY_EMAIL_INTERVALO:PT1M}
schedemy.email.lote=${SCHEDEMY_EMAIL_LOTE:50}
# E-mail que nao saiu nesse prazo (servidor fora do ar, envio desligado) vira FALHA e nao sai mais.
schedemy.email.validade=${SCHEDEMY_EMAIL_VALIDADE:PT24H}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_SENHA:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Sem isso o /actuator/health fica DOWN sempre que o SMTP estiver fora do ar (ou o envio desligado).
management.health.mail.enabled=false
