# --- Aplicação e Servidor ---
spring.application.name=schedemy
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never

# --- Docker Compose ---
spring.docker.compose.enabled=false

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- Banco de Dados MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:schedemy_db}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
# Sessao do Hibernate so dentro das transacoes dos services (os mappers rodam la dentro);
# acesso LAZY fora delas falha cedo em vez de gerar consultas escondidas na serializacao.
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Token de acesso (JWT, HS256) ---
# SCHEDEMY_JWT_SEGREDO: pelo menos 32 caracteres. Sem ele, a API sorteia um segredo a cada
# inicializacao (bom para desenvolvimento; ao reiniciar, todos precisam entrar de novo).
# Em producao defina sempre, e o mesmo em todas as instancias da API.
schedemy.jwt.segredo=${SCHEDEMY_JWT_SEGREDO:}
schedemy.jwt.validade-minutos=${SCHEDEMY_JWT_VALIDADE_MINUTOS:480}
